; PlatformIO project configuration for ESP32-S3 WiFi Dongle with SSH
; Hardware: ESP32-S3-N16R8 (16 MB flash, 8 MB PSRAM)

[platformio]
default_envs = esp32s3-dongle

[env:esp32s3-dongle]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = espidf

; 16 MB flash, custom partition table
board_build.flash_size       = 16MB
board_build.flash_mode       = qio
board_build.flash_freq       = 80m
board_build.psram            = yes
board_build.arduino.memory_type = qio_opi
board_upload.flash_size      = 16MB
board_build.partitions       = partitions.csv

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; Build flags
build_flags =
    -DCONFIG_WOLFSSH_ENABLED=1
    -DWOLFSSH_TEST_SERVER=1
    -DWOLFSSL_HAVE_SP_RSA=1
    -DWOLFSSL_SP_SMALL=1

; Upload via USB JTAG/serial
upload_protocol = esptool
upload_speed    = 921600
