name: Build

on:
  push:
    branches: ["Root-Main", "main", "develop"]
  pull_request:
    branches: ["Root-Main", "main"]

jobs:
  # ─── Firmware (ESP-IDF) ──────────────────────────────────────────────────
  firmware:
    name: Firmware (ESP-IDF v5.x)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "v5.2.2"
          target: esp32s3
          path: firmware

      - name: Generate self-signed certificate
        working-directory: firmware/certs
        run: |
          pip install cryptography
          python gen_certs.py

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "v5.2.2"
          target: esp32s3
          path: firmware
          command: idf.py build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            firmware/build/*.bin
            firmware/build/*.elf
            firmware/build/flasher_args.json
          retention-days: 30

  # ─── Companion app (Python syntax check) ────────────────────────────────
  companion:
    name: Companion (Python lint)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: companion
        run: pip install -r requirements.txt pyflakes

      - name: Syntax / lint check
        working-directory: companion
        run: python -m pyflakes ionity_companion.py
